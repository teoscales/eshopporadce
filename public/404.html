<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena | E-shop poradce</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg: #f4f1e9; --ink: #14313a; --ink-2: #4a6168; --teal: #13a39b; --teal-2: #0c8a83; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.6 "Nunito Sans", system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 520px; text-align: center; }
  h1 { font: 700 34px/1.2 "Outfit", system-ui, sans-serif; margin: 0 0 12px; }
  p { color: var(--ink-2); margin: 0 0 24px; }
  nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-block; padding: 12px 20px; border-radius: 999px; font-weight: 700; text-decoration: none; border: 2px solid var(--teal); color: var(--teal-2); background: #fff; }
  a.primary { background: var(--teal); color: #fff; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tuhle stránku jsme nenašli</h1>
  <p>Odkaz je možná starý nebo v něm chybí písmenko. Pokračujte na hlavní stránku E-shop poradce, AI nákupního asistenta pro e-shopy.</p>
  <nav aria-label="Odkazy">
    <a class="primary" href="/">Hlavní stránka</a>
    <a href="/#cenik">Ceník</a>
    <a href="/ukazkovy-eshop/">Ukázkový e-shop</a>
  </nav>
</main>
</body>
</html>
